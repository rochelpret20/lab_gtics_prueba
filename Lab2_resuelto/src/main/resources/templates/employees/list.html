<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de empleados</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Empleados</h2>

    <div class="mb-3">
        <a th:href="@{/employees/nuevo}" class="btn btn-primary">+ Nuevo empleado</a>
    </div>

    <!-- Formulario de búsqueda -->
    <form th:action="@{/employees/buscar}" method="get" class="mb-4">
        <div class="row g-2">
            <div class="col-md-3">
                <input type="text" name="texto" class="form-control" placeholder="Nombre/Email/Teléfono"
                       th:value="${texto}">
            </div>
            <div class="col-md-2">
                <input type="text" name="puesto" class="form-control" placeholder="Puesto (job_id)"
                       th:value="${puesto}">
            </div>
            <div class="col-md-2">
                <input type="number" name="salarioMin" class="form-control" placeholder="Salario mín"
                       step="0.01" th:value="${salarioMin}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-info w-100">Buscar</button>
            </div>
            <div class="col-md-2">
                <a th:href="@{/employees}" class="btn btn-secondary w-100">Limpiar</a>
            </div>
        </div>
    </form>

    <!-- Tabla de empleados -->
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Puesto</th>
            <th>Salario</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.employeeId}"></td>
            <td th:text="${employee.firstName}"></td>
            <td th:text="${employee.lastName}"></td>
            <td th:text="${employee.email}"></td>
            <td th:text="${employee.phoneNumber}"></td>
            <td th:text="${employee.jobId}"></td>
            <td th:text="${#numbers.formatDecimal(employee.salary, 1, 2)}"></td>
            <td>
                <a th:href="@{/employees/ver(id=${employee.employeeId})}" class="btn btn-sm btn-info">Ver</a>
                <a th:href="@{/employees/editar(id=${employee.employeeId})}" class="btn btn-sm btn-warning">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(employees)}" class="alert alert-warning mt-3">
        No hay empleados registrados.
    </div>
</div>
</body>
</html>
