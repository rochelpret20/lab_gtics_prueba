<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de empleado</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${employee.employeeId} != null ? 'Editar empleado' : 'Nuevoempleado'"></h2>
    <!-- th:object activa el Data Binding: cada th:field se mapea a un
    getter/setter de Employee y el binder arma el objeto solo. -->
    <form th:action="@{/employees/guardar}" th:object="${employee}" method="post">
        <!-- Pregunta 5: employee_id viaja oculto para conservar la
        identificación del registro en la edición. En alta viene vacío
        y el controller calcula el siguiente id. -->
        <input type="hidden" th:field="*{employeeId}">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{firstName}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Apellido</label>
            <input type="text" th:field="*{lastName}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="text" th:field="*{email}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{phoneNumber}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Fecha de contratación</label>
            <input type="date" th:field="*{hireDate}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Puesto (job_id)</label>
            <input type="text" th:field="*{jobId}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Salario</label>
            <input type="number" step="0.01" th:field="*{salary}" class="form-control"
                   required>
        </div>
        <div class="mb-3">
            <label class="form-label">Comisión</label>
            <input type="number" step="0.01" th:field="*{commissionPct}"
                   class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Manager ID</label>
            <input type="number" th:field="*{managerId}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Departamento ID</label>
            <input type="number" th:field="*{departmentId}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/employees}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
